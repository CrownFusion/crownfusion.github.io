<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ '/static/fig_teaser.png' | absolute_url }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --text: #1a1a1a;
  --muted: #5c6670;
  --rule: #e2e5e9;
  --accent: #0b6b63;
  --bg: #ffffff;
  --surface: #f6f8f9;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 18px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

/* ---- header ---- */
header.hero { padding: 64px 0 28px; text-align: center; }
h1.title {
  font-size: 2.6rem;
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
h1.title .sub { display: block; font-size: 1.35rem; font-weight: 400; color: var(--muted); margin-top: 10px; letter-spacing: 0; }
.venue { font-size: 1rem; color: var(--accent); font-weight: 600; margin: 14px 0 22px; }
.authors { font-size: 1.05rem; line-height: 2; margin: 0 0 4px; }
.authors a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--rule); }
.authors a:hover { border-bottom-color: var(--accent); color: var(--accent); }
.authors sup { color: var(--accent); font-size: 0.72em; font-weight: 600; }
.affil { font-size: 0.92rem; color: var(--muted); line-height: 1.9; margin: 6px 0 0; }
.affil sup { color: var(--accent); font-weight: 600; }
.note { font-size: 0.85rem; color: var(--muted); margin-top: 10px; font-style: italic; }

/* ---- link buttons ---- */
.links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 30px 0 8px; }
.links a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 20px;
  background: #24292f; color: #fff;
  border-radius: 999px;
  font-size: 0.95rem; font-weight: 500;
  text-decoration: none;
  transition: background .15s ease, transform .15s ease;
}
.links a:hover { background: var(--accent); transform: translateY(-1px); }
.links a.disabled { background: #b9c0c7; pointer-events: none; }
.links svg { width: 17px; height: 17px; fill: currentColor; }

/* ---- logos ---- */
.logos { display: flex; gap: 40px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 34px 0 0; opacity: .8; }
.logos img { height: 40px; width: auto; }

/* ---- sections ---- */
main { padding-bottom: 40px; }
section { padding: 30px 0; }
h2 {
  font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em;
  margin: 0 0 18px; padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
h3 { font-size: 1.15rem; font-weight: 600; margin: 28px 0 8px; }
p { margin: 0 0 16px; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* ---- figures ---- */
figure { margin: 26px 0; }
figure img { width: 100%; height: auto; display: block; border-radius: 6px; }
figcaption { font-size: 0.88rem; color: var(--muted); line-height: 1.55; margin-top: 10px; }
figcaption strong { color: var(--text); }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; margin: 22px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { border-bottom: 2px solid #cfd5da; font-weight: 600; }
tbody tr:last-child td { border-bottom: 2px solid #cfd5da; }
td strong { color: var(--accent); }

/* ---- highlight cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 22px 0; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.card b { display: block; color: var(--accent); font-size: 0.82rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.card span { font-size: 0.95rem; line-height: 1.5; }

/* ---- abstract ---- */
.abstract { font-size: 1.02rem; }
.abstract em { font-style: normal; font-weight: 600; }

/* ---- bibtex ---- */
pre {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 18px; overflow-x: auto;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.82rem; line-height: 1.6; color: var(--text);
}

/* ---- footer ---- */
footer { border-top: 1px solid var(--rule); padding: 26px 0 50px; font-size: 0.85rem; color: var(--muted); }
footer p { margin: 0 0 10px; }

@media (max-width: 640px) {
  body { font-size: 17px; }
  header.hero { padding: 40px 0 20px; }
  h1.title { font-size: 1.85rem; }
  h1.title .sub { font-size: 1.1rem; }
  .logos { gap: 26px; }
  .logos img { height: 30px; }
}
</style>
</head>
<body>
{{ content }}
</body>
</html>
